{% load static %}
{# Tema, fuentes y tokens del frontal. Mismo localStorage (nt-theme) que su ThemeProvider #}
<script>
  (function () {
    var t;
    try { t = localStorage.getItem('nt-theme'); } catch (e) {}
    if (!/^(lava|citrus|bloom)-(light|dark)$/.test(t || '')) {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'lava-dark' : 'lava-light';
    }
    document.documentElement.dataset.theme = t;
    document.documentElement.setAttribute('data-bs-theme', t.split('-')[1]);
  })();
</script>
