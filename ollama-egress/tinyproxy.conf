# Solo lo accesible desde la red ollama-egress (interna) y frontend; no se publica en el host
Port 8888
Listen 0.0.0.0
# Las capas de un modelo son de varios GB
Timeout 600
MaxClients 20
LogLevel Connect
DisableViaHeader Yes

# Todo lo que no esté en filter se rechaza (403), incluidos los modelos «cloud» de ollama.com
FilterDefaultDeny Yes
FilterType ere
Filter "/etc/tinyproxy/filter"
# Solo HTTPS
ConnectPort 443
